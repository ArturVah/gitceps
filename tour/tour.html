<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gitceps tour</title>
<!-- A tour of a PR or a commit, shown by the Mac app in a panel (app/TourViewer.swift). tour.js runs it. -->
<style>
  /* The sidebar stays see-through, so the panel's native sidebar material shows. Everything else is painted. */
  :root {
    color-scheme: light dark;
    --content: #ffffff; --line: rgba(0, 0, 0, .1); --text: #1d1d1f; --secondary: rgba(0, 0, 0, .55); --tertiary: rgba(0, 0, 0, .3);
    --accent: AccentColor; --on-accent: #ffffff; --button: #ffffff; --button-edge: rgba(0, 0, 0, .14);
    --ok: #1f883d; --added: rgba(31, 136, 61, .1); --removed: rgba(207, 34, 46, .08); --removed-text: #a40e26;
    --header: rgba(0, 0, 0, .03); --warn-bg: rgba(212, 167, 44, .14); --good-bg: rgba(31, 136, 61, .09);
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --content: #1e1e1e; --line: rgba(255, 255, 255, .1); --text: #f5f5f7; --secondary: rgba(255, 255, 255, .55); --tertiary: rgba(255, 255, 255, .3);
      --button: rgba(255, 255, 255, .17); --button-edge: rgba(255, 255, 255, .06);
      --ok: #3fb950; --added: rgba(63, 185, 80, .13); --removed: rgba(248, 81, 73, .13); --removed-text: #ff9b93;
      --header: rgba(255, 255, 255, .04); --warn-bg: rgba(210, 153, 34, .16); --good-bg: rgba(63, 185, 80, .13);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; }
  body { display: grid; grid-template-columns: 220px minmax(0, 1fr); font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif;
         color: var(--text); -webkit-user-select: none; cursor: default; }
  [hidden] { display: none !important; }

  /* Sidebar */
  .sidebar { display: flex; flex-direction: column; gap: 4px; padding: 12px 10px; min-height: 0; }
  .section { padding: 0 8px 4px; font-size: 11px; font-weight: 600; color: var(--secondary); display: flex; justify-content: space-between; }
  .steps { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
  .step { display: flex; gap: 7px; align-items: baseline; width: 100%; padding: 4px 8px; border: 0; border-radius: 6px;
          background: none; box-shadow: none; color: var(--text); text-align: left; }
  .step .mark { width: 12px; flex-shrink: 0; text-align: center; color: var(--tertiary); }
  .step.done .mark { color: var(--ok); }
  .step.current { background: var(--accent); color: var(--on-accent); }
  .step.current .mark { color: var(--on-accent); }
  .progress { padding: 8px 8px 2px; color: var(--secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
  .meter { height: 4px; margin: 5px 8px 8px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .option { display: flex; align-items: center; gap: 6px; padding: 2px 8px; }
  .option label { flex: 1; }

  /* Main area */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--content); border-left: 1px solid var(--line); }
  .scroll { flex: 1; overflow: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; -webkit-user-select: text; cursor: auto; }
  .eyebrow { font-size: 11px; color: var(--secondary); }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .why { display: flex; flex-direction: column; gap: 8px; max-width: 72ch; }
  .why p { margin: 0; }
  .said { color: var(--secondary); font-style: italic; }
  .source { color: var(--secondary); font: 12px var(--mono); }
  .note { padding: 7px 10px; border-radius: 6px; }
  .note.warn { background: var(--warn-bg); }
  .note.good { background: var(--good-bg); }
  #code { display: flex; flex-direction: column; gap: 14px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .card { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .card-head { display: flex; justify-content: space-between; gap: 10px; padding: 5px 10px; background: var(--header);
               border-bottom: 1px solid var(--line); font: 11.5px var(--mono); color: var(--secondary); }
  .card-head span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-head a { font-family: -apple-system, BlinkMacSystemFont, sans-serif; white-space: nowrap; }
  .lines { overflow-x: auto; }
  .line { display: flex; white-space: pre; tab-size: 4; font: 12px/1.65 var(--mono); min-width: max-content; padding-right: 12px; }
  .line .n { width: 44px; flex-shrink: 0; text-align: right; padding-right: 8px; color: var(--tertiary); -webkit-user-select: none; font-variant-numeric: tabular-nums; }
  .line .m { width: 16px; flex-shrink: 0; color: var(--tertiary); -webkit-user-select: none; }
  .line.added { background: var(--added); }
  .line.added .m { color: var(--ok); }
  .line.removed { background: var(--removed); color: var(--removed-text); }
  .line.removed .m { color: var(--removed-text); }
  .line.gap { color: var(--tertiary); }
  .more { width: 100%; border-radius: 0; box-shadow: none; border-top: 1px solid var(--line); background: var(--header); color: var(--accent); }

  .summary { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; justify-content: space-between; gap: 16px; font: 12px var(--mono); padding-bottom: 3px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row span:last-child { white-space: nowrap; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .group { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .group:last-child { border-bottom: 0; padding-bottom: 0; }
  .group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .count { color: var(--secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Action bar: secondary actions on the left, the default button on the right */
  .actions { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
  .actions .spacer { flex: 1; }
  button { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); padding: 3px 12px; min-height: 22px;
           border: 0; border-radius: 6px; background: var(--button); box-shadow: 0 0 0 .5px var(--button-edge), 0 .5px 1px rgba(0, 0, 0, .12); }
  button:active { filter: brightness(.94); }
  button:disabled { opacity: .45; }
  button.default { background: var(--accent); color: var(--on-accent); box-shadow: none; min-width: 90px; }
  button.link { padding: 0; min-height: 0; background: none; box-shadow: none; color: var(--accent); }
  :focus-visible { outline: 3px solid color-mix(in srgb, AccentColor 45%, transparent); outline-offset: 1px; }
</style>
</head>
<body>
<nav class="sidebar">
  <div class="section"><span>Steps</span><span id="position"></span></div>
  <div class="steps" id="steps"></div>
  <div class="progress" id="progress"></div>
  <div class="meter"><i id="meter"></i></div>
  <div class="option">
    <input type="checkbox" id="show-bro" checked>
    <label for="show-bro">Push Bro</label>
  </div>
</nav>
<main class="main">
  <div class="scroll" id="scroll">
    <header class="why" id="why"></header>
    <section id="code"></section>
  </div>
  <footer class="actions">
    <button id="back" type="button">‹ Back</button>
    <span class="spacer"></span>
    <button class="default" id="go" type="button">Start Tour</button>
  </footer>
</main>
<script src="tour.js"></script>
</body>
</html>
