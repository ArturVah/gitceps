[package]
name = "gitceps-window"
description = "Gitceps' windows: the push reaction in the corner of the screen, and the tour panel"
keywords = ["git", "gitceps"]
categories = ["development-tools"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
open = "5"
serde_json = "1"
tao = "0.37"
wry = "0.57"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSString", "NSThread"] }
window-vibrancy = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[lints]
workspace = true
