<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gitceps</title>
<!--
  Gitceps' drawing. engine.js moves it, scenes.js decides what he does.
  The Mac app calls play(push) once this page loads. Opened in a browser, the page plays
  the push described in its URL, e.g. overlay.html?mode=huge&ins=3214&del=1876&msg=refactor
-->
<style>
  html, body { margin:0; background:transparent; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  svg { display:block; width:100vw; height:100vh; }
  [hidden] { display:none; }
</style>
</head>
<body>
<svg id="svg" viewBox="120 0 600 440">
  <defs>
    <clipPath id="headClip"><circle cx="0" cy="-150" r="24"/></clipPath>
    <!-- "Line boil": the outlines wobble a little, like a hand-drawn cartoon. The seed changes ~8 times a second. -->
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence id="boilNoise" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="noise"/>
      <feDisplacementMap id="boilMap" in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" result="wobbly"/>
      <feDropShadow in="wobbly" dx="0" dy="2" stdDeviation="3" flood-opacity=".25"/>
    </filter>
  </defs>

  <g id="stage" opacity="0">
    <g filter="url(#ink)">
      <ellipse id="shadow" cy="382" rx="70" ry="8" fill="rgba(0,0,0,.16)"/>

      <!-- Forklift, side view, facing left. Origin = ground under the mast. -->
      <g id="forklift" hidden>
        <rect id="mastInner" x="3" width="10" fill="#7a8089"/>
        <rect x="0" y="-150" width="10" height="150" fill="#5d626b"/>
        <rect x="26" y="-182" width="6" height="112" fill="#3a3d42"/>
        <rect x="118" y="-182" width="6" height="90" fill="#3a3d42"/>
        <rect x="20" y="-188" width="110" height="8" rx="3" fill="#3a3d42"/>
        <rect id="beacon" x="104" y="-197" width="12" height="9" rx="4" fill="#ff8a1f"/>
        <g transform="translate(88,10)">
          <ellipse cx="0" cy="-104" rx="26" ry="30" fill="#3d6fd8"/>
          <use href="#head" transform="translate(0,4)"/>
          <path d="M-27 -160 q27 -30 54 0 z" fill="#f2b632"/>
          <rect x="-31" y="-161" width="62" height="5" rx="2.5" fill="#d99a1e"/>
          <path d="M-14 -112 q-14 2 -22 -2" fill="none" stroke="#f2b98d" stroke-width="12" stroke-linecap="round"/>
        </g>
        <rect x="12" y="-72" width="138" height="54" rx="8" fill="#f2b632"/>
        <rect x="118" y="-98" width="40" height="80" rx="12" fill="#d99a1e"/>
        <path d="M44 -72 l14 -36" stroke="#2b2b2e" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="57" cy="-109" rx="11" ry="3.5" fill="#2b2b2e"/>
        <g id="carriage">
          <rect x="-6" y="-42" width="10" height="46" rx="2" fill="#3a3d42"/>
          <rect x="-170" y="0" width="166" height="6" rx="2" fill="#3a3d42"/>
        </g>
        <g id="wheelF" transform="translate(40,-20)"><circle r="20" fill="#2b2b2e"/><circle r="8" fill="#8a8f98"/><rect x="-1.5" y="-8" width="3" height="16" fill="#5d626b"/></g>
        <g id="wheelR" transform="translate(130,-17)"><circle r="17" fill="#2b2b2e"/><circle r="7" fill="#8a8f98"/><rect x="-1.5" y="-7" width="3" height="14" fill="#5d626b"/></g>
      </g>

      <g id="broBody">
        <path id="legL" fill="none" stroke="#f2b98d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="legR" fill="none" stroke="#f2b98d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse id="shoeL" rx="10" ry="5" fill="#2b2b2e"/>
        <ellipse id="shoeR" rx="10" ry="5" fill="#2b2b2e"/>
        <g id="upper">
          <ellipse cx="0" cy="-80" rx="40" ry="46" fill="#3d6fd8"/>
          <text x="0" y="-68" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">PUSH</text>
          <circle cx="-34" cy="-106" r="13" fill="#f2b98d"/>
          <circle cx="34" cy="-106" r="13" fill="#f2b98d"/>
          <g id="head">
            <circle id="face" cx="0" cy="-150" r="24" fill="#f2b98d"/>
            <rect clip-path="url(#headClip)" x="-24" y="-170" width="48" height="7" fill="#e0483e"/>
            <path d="M20 -168 l16 -6 l-3 9 z" fill="#e0483e"/>
            <g fill="#1d1d1f">
              <g data-eyes="dots"><circle cx="-8" cy="-153" r="3"/><circle cx="8" cy="-153" r="3"/></g>
              <g data-eyes="lids"><circle cx="-8" cy="-151" r="2.6"/><circle cx="8" cy="-151" r="2.6"/>
                <path d="M-13 -154h10M3 -154h10" stroke="#1d1d1f" stroke-width="2.5"/></g>
              <g data-eyes="squint" fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M-13 -157l6 4l-6 4"/><path d="M13 -157l-6 4l6 4"/></g>
              <g data-eyes="xx" stroke="#1d1d1f" stroke-width="2.4" stroke-linecap="round">
                <path d="M-12 -157l7 7M-5 -157l-7 7"/><path d="M5 -157l7 7M12 -157l-7 7"/></g>
              <g data-eyes="sus"><path d="M-13 -153h9" stroke="#1d1d1f" stroke-width="2.6" stroke-linecap="round"/><circle cx="8" cy="-153" r="3"/></g>
              <g data-eyes="wide"><circle cx="-9" cy="-153" r="6" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/><circle cx="9" cy="-153" r="6" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/>
                <circle cx="-9" cy="-153" r="2.4"/><circle cx="9" cy="-153" r="2.4"/></g>
              <g data-eyes="shades"><rect x="-18" y="-158" width="15" height="9" rx="3"/><rect x="3" y="-158" width="15" height="9" rx="3"/>
                <path d="M-3 -155h6" stroke="#1d1d1f" stroke-width="2"/></g>
            </g>
            <g fill="none" stroke="#1d1d1f" stroke-width="2.4" stroke-linecap="round">
              <g data-brows="calm"><path d="M-13 -161q5 -2 9 0M4 -161q5 -2 9 0"/></g>
              <g data-brows="low"><path d="M-13 -158h9M4 -158h9"/></g>
              <g data-brows="angry"><path d="M-14 -163l10 4M14 -163l-10 4" stroke-width="3"/></g>
              <g data-brows="worried"><path d="M-13 -159l9 -4M13 -159l-9 -4"/></g>
              <g data-brows="raised"><path d="M-13 -165q5 -4 9 -1M4 -166q5 -3 9 1"/></g>
              <g data-brows="skeptic"><path d="M-14 -158h10M4 -165l10 -3"/></g>
            </g>
            <g fill="none" stroke="#1d1d1f" stroke-width="2.4" stroke-linecap="round">
              <g data-mouth="smile"><path d="M-7 -140q7 6 14 0"/></g>
              <g data-mouth="flat"><path d="M-6 -139h12"/></g>
              <g data-mouth="side"><path d="M-1 -139h8"/></g>
              <g data-mouth="wavy"><path d="M-9 -139q2.25 -3 4.5 0t4.5 0t4.5 0t4.5 0"/></g>
              <g data-mouth="teeth"><rect x="-9" y="-144" width="18" height="9" rx="2" fill="#fff" stroke-width="2"/><path d="M-9 -139.5h18" stroke-width="1.2"/></g>
              <g data-mouth="scream"><ellipse cx="0" cy="-137" rx="7" ry="9" fill="#5a1d1d" stroke="none"/></g>
              <g data-mouth="grin"><path d="M-10 -143q10 11 20 0z" fill="#fff" stroke-width="2" stroke-linejoin="round"/></g>
              <g data-mouth="o"><ellipse cx="0" cy="-138" rx="4" ry="5" fill="#5a1d1d" stroke="none"/></g>
            </g>
            <!-- Cartoon anger mark: shows up as his face goes red. -->
            <g id="vein" transform="translate(-19,-168)" fill="none" stroke="#c9302c" stroke-width="2.4" stroke-linecap="round">
              <path d="M-6 -2q4 -1 4 -5M2 -7q1 4 5 4M7 3q-4 1 -4 5M-2 8q-1 -4 -5 -4"/>
            </g>
            <g id="sweat" fill="#6cb6ff" opacity="0">
              <circle cx="-28" cy="-160" r="3"/><circle cx="28" cy="-158" r="3"/><circle cx="21" cy="-174" r="2.5"/>
            </g>
          </g>
        </g>
      </g>

      <g id="barbell"></g>

      <g id="broArms">
        <path id="armL" fill="none" stroke="#f2b98d" stroke-width="15" stroke-linecap="round"/>
        <path id="armR" fill="none" stroke="#f2b98d" stroke-width="15" stroke-linecap="round"/>
        <circle id="bicepL" r="12" fill="#f2b98d"/><circle id="bicepR" r="12" fill="#f2b98d"/>
        <circle id="handL" r="9" fill="#e9a777"/><circle id="handR" r="9" fill="#e9a777"/>
      </g>

      <g id="barTag"></g>

      <g id="dust" fill="#d8d2c4" opacity="0">
        <circle r="9"/><circle r="7"/><circle r="9"/><circle r="7"/>
      </g>

      <g transform="translate(400,74)">
        <g id="cloud" fill="#f4f7fd" stroke="#c9d6ea" stroke-width="1.5">
          <circle cx="-48" cy="6" r="26"/><circle cx="-12" cy="-12" r="34"/><circle cx="30" cy="-2" r="30"/><circle cx="58" cy="12" r="20"/>
          <rect x="-70" y="6" width="146" height="26" rx="13"/>
          <text id="cloudName" x="0" y="12" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6b86" stroke="none"></text>
        </g>
      </g>
    </g>

    <text id="cloudStatus" x="400" y="132" text-anchor="middle" font-size="16" font-weight="800"
          stroke="#fff" stroke-width="4" paint-order="stroke"></text>

    <g id="bubble" opacity="0">
      <rect id="bubRect" rx="10" fill="#fff" stroke="#1d1d1f" stroke-width="2"/>
      <path id="bubTail" fill="#fff" stroke="#1d1d1f" stroke-width="2" stroke-linejoin="round"/>
      <text id="bubText" font-size="15" font-weight="700" fill="#1d1d1f"></text>
    </g>
  </g>
</svg>

<script src="engine.js"></script>
<script src="scenes.js"></script>
<script>
  "use strict";
  // Outside the Mac app, play the push described in the URL, or a sample.
  if (!window.webkit?.messageHandlers?.done) {
    const query = Object.fromEntries(new URLSearchParams(location.search));
    play(query.mode ? query : { mode: "huge", ins: 3214, del: 1876, msg: "refactor: rewrite everything" });
  }
</script>
</body>
</html>
