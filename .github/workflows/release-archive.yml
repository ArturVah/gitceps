# Attaches the source archive to every published release. install.sh and the Homebrew formula
# download this file rather than GitHub's automatic archive, because GitHub only counts downloads
# of attached files. That count is the install number.
name: Release archive

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach gitceps-<version>.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="gitceps-${TAG#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          gh release upload "$TAG" "$name.tar.gz"
          shasum -a 256 "$name.tar.gz"
