# Builds Gitceps for every system and attaches the archives to a published release. install.sh, install.ps1
# and the Homebrew formula download them from releases/latest/download, so the file names carry no version.
# Run by hand, it builds the same archives and keeps them with the run, to try before a release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, name: macos, targets: aarch64-apple-darwin x86_64-apple-darwin }
          - { os: ubuntu-22.04, name: linux-x86_64, targets: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, name: linux-arm64, targets: aarch64-unknown-linux-gnu }
          - { os: windows-latest, name: windows-x86_64, targets: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the window libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Build
        shell: bash
        run: |
          for target in ${{ matrix.targets }}; do
            rustup target add "$target"
            cargo build --release --locked --target "$target"
          done
      - name: Pack
        shell: bash
        run: |
          mkdir pack
          case "${{ matrix.name }}" in
            macos)   # one file for both kinds of Mac
              for program in gitceps gitceps-window; do
                lipo -create -output "pack/$program" target/*-apple-darwin/release/"$program"
              done
              tar -czf gitceps-macos.tar.gz -C pack gitceps gitceps-window ;;
            windows-*)
              cp target/${{ matrix.targets }}/release/gitceps.exe target/${{ matrix.targets }}/release/gitceps-window.exe pack/
              (cd pack && 7z a ../gitceps-${{ matrix.name }}.zip gitceps.exe gitceps-window.exe) ;;
            *)
              cp target/${{ matrix.targets }}/release/gitceps target/${{ matrix.targets }}/release/gitceps-window pack/
              tar -czf gitceps-${{ matrix.name }}.tar.gz -C pack gitceps gitceps-window ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitceps-${{ matrix.name }}
          path: |
            gitceps-*.tar.gz
            gitceps-*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - run: sha256sum gitceps-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: gitceps-*
      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" gitceps-* SHA256SUMS --repo "$GITHUB_REPOSITORY"
