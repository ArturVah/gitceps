[workspace]
members = ["crates/gitceps"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ArturVah/gitceps"
homepage = "https://gitceps.app"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
